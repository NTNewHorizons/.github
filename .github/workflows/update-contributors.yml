name: Update Contributors

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-all-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Checkout all three repos
      - name: Checkout .github
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.UNIVERSAL_FINE }}
          path: github-repo

      - name: Checkout NTNH
        uses: actions/checkout@v4
        with:
          repository: NTNewHorizons/NTNH
          token: ${{ secrets.UNIVERSAL_FINE }}
          path: ntnh-repo

      - name: Checkout NTNH-Translations
        uses: actions/checkout@v4
        with:
          repository: NTNewHorizons/NTNH-Translations
          token: ${{ secrets.UNIVERSAL_FINE }}
          path: translations-repo

      # 2. Fetch code contributors and update the Code Table
      - name: Fetch and format Code Contributors
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.UNIVERSAL_FINE }}
          script: |
            const org = 'NTNewHorizons';
            const fs = require('fs');
            
            const { data: repos } = await github.rest.repos.listForOrg({
              org, type: 'public', per_page: 100
            });
            
            const contributorMap = new Map();
            for (const repo of repos) {
              if (repo.fork) continue;
              try {
                const { data } = await github.rest.repos.listContributors({
                  owner: org, repo: repo.name, per_page: 100
                });
                for (const c of data) {
                  if (c.type === 'User') {
                    const existing = contributorMap.get(c.login) || { ...c, contributions: 0 };
                    existing.contributions += c.contributions;
                    contributorMap.set(c.login, existing);
                  }
                }
              } catch (e) {}
            }
            
            const sorted = Array.from(contributorMap.values()).sort((a, b) => b.contributions - a.contributions);
            const rows = [];
            for (let i = 0; i < sorted.length; i += 7) {
              const cells = sorted.slice(i, i + 7).map(c => 
                `<td align="center"><a href="${c.html_url}"><img src="${c.avatar_url}" width="50" alt="${c.login}" style="border-radius:50%;margin:5px;"/></a><br/><sub><b>${c.login}</b></sub><br/><span>${c.contributions} 🏆</span></td>`
              ).join('\n');
              rows.push(`<tr>${cells}</tr>`);
            }
            
            // USE align="center" — GitHub strips style attributes
            const html = `<div align="center">\n<h2>🌟 Our Amazing Contributors 🌟</h2>\n<table align="center">\n${rows.join('\n')}\n</table>\n</div>\n`;
            
            for (const p of ['github-repo/profile/README.md', 'ntnh-repo/README.md']) {
              if (!fs.existsSync(p)) continue;
              let content = fs.readFileSync(p, 'utf8');
              const start = content.indexOf('<!-- CONTRIBUTORS_START -->') + '<!-- CONTRIBUTORS_START -->'.length;
              const end = content.indexOf('<!-- CONTRIBUTORS_END -->');
              if (start !== -1 && end !== -1) {
                fs.writeFileSync(p, content.substring(0, start) + '\n' + html + content.substring(end));
              }
            }

      # 3. Generate Crowdin Tables (one step per repo)
      - name: Generate Crowdin Table for .github
        uses: andrii-bodnar/action-crowdin-contributors@v3
        with:
          contributors_per_line: 7
          max_contributors: 50
          image_size: 50
          min_words_contributed: 10
          include_languages: false
          placeholder_start: '<!-- CROWDIN_CONTRIBUTORS_START -->'
          placeholder_end: '<!-- CROWDIN_CONTRIBUTORS_END -->'
          files: 'github-repo/profile/README.md'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Generate Crowdin Table for NTNH
        uses: andrii-bodnar/action-crowdin-contributors@v3
        with:
          contributors_per_line: 7
          max_contributors: 50
          image_size: 50
          min_words_contributed: 10
          include_languages: false
          placeholder_start: '<!-- CROWDIN_CONTRIBUTORS_START -->'
          placeholder_end: '<!-- CROWDIN_CONTRIBUTORS_END -->'
          files: 'ntnh-repo/README.md'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Generate Crowdin Table for Translations
        uses: andrii-bodnar/action-crowdin-contributors@v3
        with:
          contributors_per_line: 7
          max_contributors: 50
          image_size: 50
          min_words_contributed: 10
          include_languages: false
          placeholder_start: '<!-- CROWDIN_CONTRIBUTORS_START -->'
          placeholder_end: '<!-- CROWDIN_CONTRIBUTORS_END -->'
          files: 'translations-repo/README.md'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # 4. ONE clean script to format, center, and exclude users
      - name: Format and Center Translation Tables
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const files = ['github-repo/profile/README.md', 'ntnh-repo/README.md', 'translations-repo/README.md'];
          const excluded = ['Bufka2011', 'BufkaSecond'];

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            let content = fs.readFileSync(file, 'utf8');
            
            const startMarker = '<!-- CROWDIN_CONTRIBUTORS_START -->';
            const endMarker = '<!-- CROWDIN_CONTRIBUTORS_END -->';
            const startIdx = content.indexOf(startMarker) + startMarker.length;
            const endIdx = content.indexOf(endMarker);

            if (startIdx !== -1 && endIdx !== -1) {
              let section = content.substring(startIdx, endIdx);

              // 1. Remove excluded users completely (regex matches the whole <td> block)
              for (const user of excluded) {
                const regex = new RegExp(`<td[^>]*>[\\s\\S]*?${user}[\\s\\S]*?<\\/td>`, 'gi');
                section = section.replace(regex, '');
              }

              // 2. Strip leading spaces to prevent Markdown from rendering as a code block
              section = section.split('\n').map(l => l.trimStart()).join('\n');

              // 3. Force center alignment on the table
              section = section.replace(/<table[^>]*>/gi, '<table align="center">');

              // 4. Reassemble with a clean centered div
              const newSection = `\n<div align="center">\n<h2>🌟 Our Wonderful Translation Contributors 🌟</h2>\n${section}\n</div>\n`;
              content = content.substring(0, startIdx) + newSection + content.substring(endIdx);
              
              fs.writeFileSync(file, content);
            }
          }
          EOF

      # 5. Single Commit & Push Step for all repos
      - name: Commit and push changes
        run: |
          for dir in github-repo ntnh-repo translations-repo; do
            cd $dir
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add . || true
            if ! git diff --staged --quiet; then
              git commit -m "🤖 Auto-update contributors list"
              git push
            fi
            cd ..
          done
